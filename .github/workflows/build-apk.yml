name: Build Android APK & Google Play AAB Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Mobile-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    name: Build Android APK & Google Play AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Mobile-app/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: Mobile-app
        run: npm install --legacy-peer-deps


      - name: Create .env file for mobile build
        working-directory: Mobile-app
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_API_URL=https://quickcart-nu-nine.vercel.app
          EXPO_PUBLIC_SUPABASE_URL=https://dopgzhmkexmuwjrllfcf.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_u0o6JzFPooNNJcDyLiaGbg_6hO2BmM8
          EXPO_PUBLIC_TRUECALLER_CLIENT_ID=oewpqo0wlybxpjhi3tcjsb5a1nhjoaszzh988n6zamc
          EOF

      - name: Prebuild native Android project
        working-directory: Mobile-app
        env:
          EXPO_PUBLIC_API_URL: "https://quickcart-nu-nine.vercel.app"
          EXPO_PUBLIC_SUPABASE_URL: "https://dopgzhmkexmuwjrllfcf.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_u0o6JzFPooNNJcDyLiaGbg_6hO2BmM8"
          EXPO_PUBLIC_TRUECALLER_CLIENT_ID: "oewpqo0wlybxpjhi3tcjsb5a1nhjoaszzh988n6zamc"
          NODE_ENV: "production"
        run: npx expo prebuild --platform android --no-install

      - name: Configure Production Keystore and Signing
        working-directory: Mobile-app
        run: |
          cat release-keystore.b64 | base64 -d > android/app/release.keystore
          node scripts/configure-release-signing.js

      - name: Make Gradle wrapper executable
        run: chmod +x Mobile-app/android/gradlew

      - name: Build release APK and Google Play AAB Bundle
        working-directory: Mobile-app/android
        env:
          EXPO_PUBLIC_API_URL: "https://quickcart-nu-nine.vercel.app"
          EXPO_PUBLIC_SUPABASE_URL: "https://dopgzhmkexmuwjrllfcf.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_u0o6JzFPooNNJcDyLiaGbg_6hO2BmM8"
          EXPO_PUBLIC_TRUECALLER_CLIENT_ID: "oewpqo0wlybxpjhi3tcjsb5a1nhjoaszzh988n6zamc"
          NODE_ENV: "production"
        run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB Release Certificate
        working-directory: Mobile-app/android
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Inspecting certificate in $AAB_FILE..."
          CERT_INFO=$(unzip -p "$AAB_FILE" META-INF/*.RSA | openssl pkcs7 -inform DER -print_certs -text)
          if echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "FATAL: Bundle was signed with Android Debug certificate!"
            exit 1
          fi
          if ! echo "$CERT_INFO" | grep -q "CN=QuickCart"; then
            echo "FATAL: Bundle does not contain QuickCart release certificate!"
            exit 1
          fi
          echo "VERIFIED: Bundle is signed with QuickCart production release certificate."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcart-apk
          path: Mobile-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Google Play AAB Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcart-aab
          path: Mobile-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
